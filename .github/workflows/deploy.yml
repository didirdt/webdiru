name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a manual re-run from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a new push cancels the one in flight.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  # A project Pages site is served from https://<user>.github.io/<repo>/,
  # so the build needs that base path.
  # Set this to an empty string once didiru.web.id points at this repo, so the
  # site is served from the domain root instead.
  NEXT_BASE_PATH: webdiru

  # Custom domain. Leave empty while using the github.io URL.
  # When set, a CNAME file is written so GitHub serves the site for it.
  CUSTOM_DOMAIN: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Resolve site URL
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            echo "NEXT_PUBLIC_SITE_URL=https://$CUSTOM_DOMAIN" >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_SITE_URL=https://didirdt.github.io/$NEXT_BASE_PATH" >> "$GITHUB_ENV"
          fi

      - name: Build static site
        run: npm run build
        env:
          NEXT_BASE_PATH: ${{ env.NEXT_BASE_PATH }}

      - name: Write CNAME
        if: env.CUSTOM_DOMAIN != ''
        run: echo "${{ env.CUSTOM_DOMAIN }}" > out/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
